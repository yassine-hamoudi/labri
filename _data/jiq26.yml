- id: 21
  name: Denis Rochette
  affiliation: Inria Saclay
  title: Optimal untelegraphable encryption and implications for uncloneable encryption
  abstract: "We study untelegraphable encryption (UTE), a quantum encryption primitive that refines uncloneable encryption (UE) by restricting adversaries to output only classical information. We give an unconditionally secure construction achieving untelegraphable-indistinguishability, along with natural multi-ciphertext and bounded collusion-resistant extensions, without additional assumptions. Assuming pseudo-random unitaries, we further obtain an unbounded variant with everlasting security. We then leverage UTE techniques to advance UE by deriving new lower bounds that also apply to UE and by proving an asymptotic equivalence between UTE and UE as the number of UE adversaries grows."

- id: 22
  name: Joseph Cunningham
  affiliation: LaBRI
  title: Poisson-distributed discrete adiabatic dynamics
  abstract: "We propose a general framework for analysing the performance of quantum algorithms that consist of performing discrete operations controlled by a Poisson process. This extends our previous work [TQC 2024]. In particular, we are interested in emulating certain features of adiabatic quantum computation without having to simulate time-dependent Hamiltonian evolution, since this typically causes a significant discretisation cost. The resulting error bounds share many key features with the error bounds in adiabatic quantum computation. And many results are directly applicable. As applications, we show how our framework yields six distinct approaches to both the Grover search problem and the quantum linear systems problem that all achieve optimal asymptotic complexity. We can also apply our framework to Trotterisation. In this way we are able to show that discretisation in the context of adiabatic quantum computing is less costly than the general bounds on the Trotterisation error would imply. In this way we are able to reproduce key results from [arXiv: 2509.00171]."

