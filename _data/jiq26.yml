- id: 12
  name: Bruno Costa Alves Freire
  affiliation: Inria Paris
  title: Quantum Maxwell decoder for CSS codes
  abstract: "Quantum error correction is essential for reliable quantum computation. A simplified noise model is the erasure channel, where qubits are randomly erased and the decoder knows the erased positions. Despite its simplicity, it offers valuable insight and is relevant for platforms that can convert native errors into erasures. Maximum-likelihood erasure decoding via Gaussian elimination is optimal but has cubic time complexity, motivating fast, iterative decoders such as belief propagation and, for erasures, the peeling decoder. In qLDPC codes, peeling struggles due to small stopping sets caused by low-weight stabilizers. Variants like pruning, guided decimation, and cluster peeling address this issue. Here we adapt the Maxwell decoder to CSS codes by adding controlled guessing to peeling and pruned peeling. The resulting decoder reaches maximum-likelihood performance with complexity no worse than Gaussian elimination, and can be restricted to linear time at some cost in decoding quality."

- id: 13
  name: Marc Baboulin
  affiliation: Inria & Université Paris-Saclay
  title: Toward quantum-accelerated high-performance computing
  abstract: Quantum computing (QC) aims at addressing computations that are currently intractable by conventional supercomputers. However, to be attractive for sustainable research and industrial investments, QC must not be limited to specific computations but also be seen as potential accelerator for general purpose simulations in high-performance scientific computing. In this talk we explain how core tasks in scientific computing can be addressed by quantum algorithms, possibly combined with classical ones. In particular we describe recent advances in algorithms for decomposing and handling matrices (generic, or coming from PDEs) in quantum computers. We also present promising methods for the solution of linear systems of equations with improvement in terms of accuracy and cost for the solution.

