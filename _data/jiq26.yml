- id: 15
  name: Océane Koska
  affiliation: Eviden & Université Paris-Saclay
  title: From NISQ to hybrid computing
  abstract: "Most of NISQ (Noisy Intermediate-Scale Quantum) programming frameworks have been developed to minimise noise and enhance execution on QPUs (Quantum Processing Units). However, it should be noted that this type of programming does not allow for hybrid computing as known from HPC. Nevertheless, the evolution of QPUs towards the integration of error correction promises to revolutionize the use of quantum devices. This technological advance will overcome the current limitations of NISQ systems, paving the way for a new era of quantum programming. In this context, quantum programming is set to evolve, to take advantage of the new capabilities offered by QPUs. To explore these changes, we will use the Q-Pragma quantum programming framework as a practical example."

- id: 16
  name: Rafael Ferreira da Silva
  affiliation: Oak Ridge National Laboratory
  title: Enabling quantum-HPC convergence for future scientific workflows
  abstract: "As quantum computing capabilities continue to mature, integrating them effectively into HPC ecosystems will require more than hardware progress alone. This talk explores how workflow-driven approaches can accelerate meaningful Quantum-HPC convergence by enabling hybrid execution models, flexible orchestration, shared abstractions, and scalable software stacks. Rather than centering on quantum hardware details, the discussion focuses on workflow patterns, resource management strategies, interoperability challenges, and emerging software frameworks that support hybrid computation as a first-class model. The goal is to highlight how workflow systems can bridge paradigms, support user adoption, and pave the way for future scientific discovery powered by heterogeneous quantum and classical resources."

- id: 17
  name: Elise Frassard
  affiliation: Thalès & Ecole Polytechnique
  title: Adaptive mesh refinement quantum algorithm for Maxwell's equations
  abstract: "Quantum computers hold promise for solving partial differential equations discretized into linear systems using for example the finite element method. However, this method is usually incorporated into a high-level numerical scheme which allows the adaptive refinement of the mesh where it most improves the accuracy of the solution. In this work, we propose to extend adaptive mesh refinement to the quantum formalism. We address the solution of time-harmonic Maxwell’s equations. An important step in the procedure is the computation of error estimators, which guide the refinement. By using block-encoding, we propose a way to compute these estimators with quantum circuits."

- id: 18
  name: Jules Duhamel
  affiliation: EPFL & SNCF
  title: Quantum algorithms for train crew scheduling optimization
  abstract: "Train crew scheduling is a large-scale NP-hard combinatorial optimization problem subject to strict operational and human constraints. The objective is to reduce the use of taxis and hotels by the crews and to minimize unnecessary waiting times between successive jobs. At SNCF, this problem is still mostly solved manually, leading to suboptimal solutions. This work investigates the potential of quantum computing to obtain near-optimal schedules. We study a QUBO-based variational approach and an alternative method that restricts the quantum search space to feasible schedules only, combined with a Grover-based minimum search. Resource scaling and theoretical complexity are analyzed, highlighting current limitations and long-term potential."

- id: 19
  name: Bo Yang
  affiliation: LIP6
  title: Verifiable blind observable estimation
  abstract: "Cryptographic verification protocols enable composably secure delegated quantum computation for tasks that no longer admit efficient classical validation and are executed on untrusted remote quantum servers. However, efficient protocols with low space overhead are limited to tasks whose correctness can be amplified by majority voting, and no cryptographic resource effectively captures the security of observable estimation tasks that appear in various near-term applications. We introduce a protocol that implements a newly defined cryptographic resource that characterises secure delegated observable estimation, returning an estimate within ε>0 of the true expectation value or otherwise aborts. The required cost consists solely of test rounds that are no more complex than the target computation and the security error is negligible in the total rounds. These guarantees establish the only known path to efficiently verifying pre-fault-tolerant applications driving potential quantum advantage."

