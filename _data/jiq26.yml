- id: 15
  name: Océane Koska
  affiliation: Eviden & Université Paris-Saclay
  title: From NISQ to hybrid computing
  abstract: "Most of NISQ (Noisy Intermediate-Scale Quantum) programming frameworks have been developed to minimise noise and enhance execution on QPUs (Quantum Processing Units). However, it should be noted that this type of programming does not allow for hybrid computing as known from HPC. Nevertheless, the evolution of QPUs towards the integration of error correction promises to revolutionize the use of quantum devices. This technological advance will overcome the current limitations of NISQ systems, paving the way for a new era of quantum programming. In this context, quantum programming is set to evolve, to take advantage of the new capabilities offered by QPUs. To explore these changes, we will use the Q-Pragma quantum programming framework as a practical example."

- id: 16
  name: Rafael Ferreira da Silva
  affiliation: Oak Ridge National Laboratory
  title: Enabling quantum-HPC convergence for future scientific workflows
  abstract: "As quantum computing capabilities continue to mature, integrating them effectively into HPC ecosystems will require more than hardware progress alone. This talk explores how workflow-driven approaches can accelerate meaningful Quantum-HPC convergence by enabling hybrid execution models, flexible orchestration, shared abstractions, and scalable software stacks. Rather than centering on quantum hardware details, the discussion focuses on workflow patterns, resource management strategies, interoperability challenges, and emerging software frameworks that support hybrid computation as a first-class model. The goal is to highlight how workflow systems can bridge paradigms, support user adoption, and pave the way for future scientific discovery powered by heterogeneous quantum and classical resources."

- id: 17
  name: Elise Fressart
  affiliation: Thalès & Ecole Polytechnique
  title: Adaptive mesh refinement quantum algorithm for Maxwell's equations
  abstract: "Quantum computers hold promise for solving partial differential equations discretized into linear systems using for example the finite element method. However, this method is usually incorporated into a high-level numerical scheme which allows the adaptive refinement of the mesh where it most improves the accuracy of the solution. In this work, we propose to extend adaptive mesh refinement to the quantum formalism. We address the solution of time-harmonic Maxwell’s equations. An important step in the procedure is the computation of error estimators, which guide the refinement. By using block-encoding, we propose a way to compute these estimators with quantum circuits."

- id: 18
  name: Jules Duhamel
  affiliation: EPFL & SNCF
  title: Quantum algorithms for train crew scheduling optimization
  abstract: "Train crew scheduling is a large-scale NP-hard combinatorial optimization problem subject to strict operational and human constraints. The objective is to reduce the use of taxis and hotels by the crews and to minimize unnecessary waiting times between successive jobs. At SNCF, this problem is still mostly solved manually, leading to suboptimal solutions. This work investigates the potential of quantum computing to obtain near-optimal schedules. We study a QUBO-based variational approach and an alternative method that restricts the quantum search space to feasible schedules only, combined with a Grover-based minimum search. Resource scaling and theoretical complexity are analyzed, highlighting current limitations and long-term potential."

- id: 19
  name: Bo Yang
  affiliation: LIP6
  title: Verifiable blind observable estimation
  abstract: "Cryptographic verification protocols enable composably secure delegated quantum computation for tasks that no longer admit efficient classical validation and are executed on untrusted remote quantum servers. However, efficient protocols with low space overhead are limited to tasks whose correctness can be amplified by majority voting, and no cryptographic resource effectively captures the security of observable estimation tasks that appear in various near-term applications. We introduce a protocol that implements a newly defined cryptographic resource that characterises secure delegated observable estimation, returning an estimate within ε>0 of the true expectation value or otherwise aborts. The required cost consists solely of test rounds that are no more complex than the target computation and the security error is negligible in the total rounds. These guarantees establish the only known path to efficiently verifying pre-fault-tolerant applications driving potential quantum advantage."

- id: 20
  name: Pierre Botteron
  affiliation: ENS & Inria Lyon
  title: "Quantum unclonable cryptography: does the unclonable bit exist?"
  abstract: "Unclonable encryption is a cryptographic primitive that encrypts a classical message into a quantum ciphertext, such that two quantum adversaries are limited in their capacity of being able to simultaneously decrypt, given the key and quantum side-information produced from the ciphertext. Since its initial proposal and scheme in the random oracle model by Broadbent and Lord [TQC 2020], unclonable encryption has developed into an important primitive at the foundation of quantum unclonability for cryptographic primitives. Despite sustained efforts, however, the question of unconditional unclonable encryption (and in particular of the simplest case, called an unclonable bit) has remained elusive. Here, we propose a candidate for the unconditional unclonable bit problem, and provide strong evidence that the adversary's success probability in the related security game converges quadratically as 1/2+1/(2√K), where K represents the number of keys and 1/2 is trivially achievable. We prove this bound's validity for K ranging from 2 to 7 and demonstrate the validity up to K=17 using computations based on the NPA hierarchy. We furthermore provide compelling heuristic evidence towards the general case. In addition, we prove an asymptotic upper bound of 5/8 and give a numerical upper bound of ∼0.5980, which to our knowledge is the best-known value in the unconditional model. This is a joint work with Anne Broadbent, Eric Culf, Ion Nechita, Clément Pellegrini, and Denis Rochette. [Reference: https://arxiv.org/abs/2410.23064]"

- id: 21
  name: Denis Rochette
  affiliation: Inria Saclay
  title: Optimal untelegraphable encryption and implications for uncloneable encryption
  abstract: "We study untelegraphable encryption (UTE), a quantum encryption primitive that refines uncloneable encryption (UE) by restricting adversaries to output only classical information. We give an unconditionally secure construction achieving untelegraphable-indistinguishability, along with natural multi-ciphertext and bounded collusion-resistant extensions, without additional assumptions. Assuming pseudo-random unitaries, we further obtain an unbounded variant with everlasting security. We then leverage UTE techniques to advance UE by deriving new lower bounds that also apply to UE and by proving an asymptotic equivalence between UTE and UE as the number of UE adversaries grows."

- id: 22
  name: Joseph Cunningham
  affiliation: LaBRI
  title: Poisson-distributed discrete adiabatic dynamics
  abstract: "We propose a general framework for analysing the performance of quantum algorithms that consist of performing discrete operations controlled by a Poisson process. This extends our previous work [TQC 2024]. In particular, we are interested in emulating certain features of adiabatic quantum computation without having to simulate time-dependent Hamiltonian evolution, since this typically causes a significant discretisation cost. The resulting error bounds share many key features with the error bounds in adiabatic quantum computation. And many results are directly applicable. As applications, we show how our framework yields six distinct approaches to both the Grover search problem and the quantum linear systems problem that all achieve optimal asymptotic complexity. We can also apply our framework to Trotterisation. In this way we are able to show that discretisation in the context of adiabatic quantum computing is less costly than the general bounds on the Trotterisation error would imply. In this way we are able to reproduce key results from [arXiv: 2509.00171]."

- id: 23
  name: Rachel Roux
  affiliation: MBDA
  title: Investigating the use of the discrete quantum walk to solve combinatorial optimization problems
  abstract: "Our work targets the optimization problems usually encountered by MBDA when designing missile systems : multi-objective optimal path and optimal assignment. These problems usually become NP-hard as soon as they integrate several constraints. Our investigations led us to quantum walk algorithms which can take advantage of graph-structured problems. One of the challenges is to account for the constraints that make one solution feasible or not, i.e., to reduce the Hilbert Space to only solutions that satisfy these constraints. We thus developed a graph who’s each edge represents a valid solution and two solutions are connected thanks to only their local differences. The next challenge is to find a quantum operator which will lead to the desired stationary distribution. We performed a few classical tests to ensure the validity of this approach and currently study whether this approach can scale on a Quantum Computer."

- id: 24
  name: Xiaoyu Sun
  affiliation: LIS
  title: On quantum perceptron learning via quantum search
  abstract: "With the growing interest in quantum machine learning, the perceptron, a fundamental building block in traditional machine learning, has emerged as a valuable model for exploring quantum advantages. In this work, we make two principal contributions. First, we revisit the quantum version space perceptron algorithm proposed by Kapoor et al. (2016), identifying and correcting a flawed complexity assumption. We prove that the complexity of the algorithm is dimension-dependent, which has significant implications for the feasibility of the sampling-based quantum perceptron algorithm in high-dimensional regimes. Second, we propose and analyse two quantum-enhanced cutting-plane algorithms for perceptron learning. Specifically, we leverage established quantum tools, such as Grover’s search and quantum walk search, in these algorithms. We provide detailed algorithmic constructions, complexity analysis, and comparison to their classical counterparts. Our results demonstrate how quantum resources can yield provable improvements in query complexity and arithmetic operations, providing constructive insights into the statistical efficiency of different perceptron models and offering new perspectives on quantum perceptron learning."

- id: 25
  name: Benjamin Mathieu-Bloise
  affiliation: IRIF
  title: Complexity of computations on simplicial complexes in quantum logspace
  abstract: "Quantum computing seems to have a significant advantage when it comes to topology-related problems. Although the most usual topology problems in computer science are proven to be very hard, the LGZ algorithm seems to achieve an exponential speed-up over classical algorithms on an extensive amount of hard instances of classical computing of Betti numbers. Conversely, it was recently shown that solving a linear system can be reduced to solving a linear system in the Laplacian of a simplicial complex. In fact, we show how this reduction is achievable in classical log-space. Since it is known that solving a dense well-conditioned linear system is complete for quantum log-space, the above result this, in fact, implies completeness for quantum log-space of solving well-conditioned Laplacian systems. We discuss it, as well as other homology related problems, bringing us to a landscape of space-restricted classes of complexity."
